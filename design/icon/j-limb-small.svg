<?xml version="1.0" encoding="UTF-8"?>
<!-- Small-size variant of the J icon for 16 and 32 px: thicker limb, bigger glint, no notch lip lights. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<defs>
<linearGradient id="tile" gradientUnits="userSpaceOnUse" x1="0" y1="100" x2="0" y2="924">
<stop offset="0" stop-color="#05060C"/>
<stop offset="0.6" stop-color="#080D1C"/>
<stop offset="1" stop-color="#0D172E"/>
</linearGradient>
<clipPath id="clip"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
<linearGradient id="atm" gradientUnits="userSpaceOnUse" x1="100" y1="0" x2="924" y2="0">
<stop offset="0" stop-color="#E8865F"/>
<stop offset="0.55" stop-color="#FFC15C"/>
<stop offset="1" stop-color="#74D6C2"/>
</linearGradient>
<linearGradient id="planet" gradientUnits="userSpaceOnUse" x1="0" y1="600" x2="0" y2="924">
<stop offset="0" stop-color="#070A16"/>
<stop offset="1" stop-color="#020308"/>
</linearGradient>
<filter id="far" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024"><feGaussianBlur stdDeviation="40"/></filter>
<filter id="near" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024"><feGaussianBlur stdDeviation="14"/></filter>
</defs>
<rect x="0" y="0" width="1024" height="1024" fill="url(#tile)"/>
<g clip-path="url(#clip)">
<circle cx="512" cy="1500" r="900" fill="none" stroke="url(#atm)" stroke-width="150" opacity="0.95" filter="url(#far)"/>
<circle cx="512" cy="1500" r="900" fill="none" stroke="url(#atm)" stroke-width="60" filter="url(#near)"/>
<circle cx="650" cy="611" r="90" fill="#FFE2B0" opacity="0.9" filter="url(#near)"/>
<circle cx="512" cy="1500" r="900" fill="url(#planet)"/>
<circle cx="512" cy="1500" r="900" fill="none" stroke="url(#atm)" stroke-width="28"/>
<circle cx="650" cy="610" r="34" fill="#FFFFFF"/>
<path d="M 352 100 H 672 V 192 A 44 44 0 0 1 628 236 H 396 A 44 44 0 0 1 352 192 Z" fill="#000000"/>
</g>
</svg>
