<?xml version="1.0" encoding="UTF-8"?>
<!-- Aureole app icon, "J · 晨昏线": a planet's limb lit at dawn, the notch above it. 1024 grid, 824 tile. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<defs>
<linearGradient id="tile" gradientUnits="userSpaceOnUse" x1="0" y1="100" x2="0" y2="924">
<stop offset="0" stop-color="#04050A"/>
<stop offset="0.6" stop-color="#070B18"/>
<stop offset="1" stop-color="#0B1428"/>
</linearGradient>
<clipPath id="clip"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
<linearGradient id="atm" gradientUnits="userSpaceOnUse" x1="100" y1="0" x2="924" y2="0">
<stop offset="0" stop-color="#DE7D5C"/>
<stop offset="0.55" stop-color="#FFBA52"/>
<stop offset="1" stop-color="#6BCCB8"/>
