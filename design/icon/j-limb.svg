<stop offset="0" stop-color="#070A16"/>
<stop offset="1" stop-color="#020308"/>
</linearGradient>
<filter id="far" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024"><feGaussianBlur stdDeviation="36"/></filter>
<filter id="near" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024"><feGaussianBlur stdDeviation="11"/></filter>
</defs>
<rect x="0" y="0" width="1024" height="1024" fill="url(#tile)"/>
